title = "Geode"
gitRepoUrl = "https://github.com/qvyra/geode"
gitSourceBranch = "main"
changelog = true

classOrder = [
	{ section = "Start here", classes = ["Geode", "PlayerData", "PlayerProfile"] },
	{ section = "Profiles", classes = ["Profile", "ProfileStore"] },
	{ section = "Data and rules", classes = ["t", "Schema", "guard", "GuardSet", "FacetSet", "Document", "Transaction"] },
	{ section = "Shared and ephemeral", classes = ["Shared", "SharedStore", "Ephemeral", "HashMap", "SortedMap", "Queue", "Presence", "Mutex", "Lock", "Counter", "RateLimiter", "JobQueue"] },
	{ section = "Matchmaking and leaderboards", classes = ["Matchmaker", "Ranked", "Leaderboard"] },
