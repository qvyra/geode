[docusaurus]
url = "https://qvyra.github.io"
baseUrl = "/geode/"
tagline = "A layered data framework for Roblox"
# from .moonwave/static, which Moonwave copies into the site
favicon = "favicon.ico"

[navbar.logo]
alt = "Geode"
src = "logo.png"

[home]
enabled = true
includeReadme = false

[[home.features]]
title = "Player data in one call"
description = "Profiles load on join, save on leave and survive server hops, with session leases that never let two servers write the same data."

[[home.features]]
title = "One write path"
description = "Every change runs through one transaction pipeline, so guards, reactions, replication and history all see the same thing."

[[home.features]]
title = "Tested without Roblox"
description = "Every service sits behind an adapter with an in-memory mock, virtual time and fault injection, and the same contracts run against live services."
